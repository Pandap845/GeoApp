name: Tests

# Testing pipeline for gtfs-ingest.
#
# Three jobs:
#   * lint        - ruff check + ruff format --check (rules in pyproject.toml).
#   * unit        - fast pytest run with no database, across an OS/Python
#                   matrix. DB-backed tests self-skip when
#                   GTFS_TEST_DATABASE_URL is unset (see tests/test_db.py,
#                   tests/test_conflation_live.py).
#   * integration - full pytest run against a live PostGIS service container,
#                   exercising the live DB / OSM-conflation tests too.
#   * docs        - Sphinx build with -W, so a docstring whose markup breaks
#                   the API reference fails the pipeline like any other bug.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Pinned (same as the dev extra), so a ruff release never breaks the build.
      - name: Install ruff
        run: pip install ruff==0.16.6

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format --check
        run: ruff format --check .

  unit:
    name: Unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + test deps
        run: python -m pip install -e ".[dev]"

      # No GTFS_TEST_DATABASE_URL here, so the live PostGIS / conflation tests
      # skip and only the pure-unit suite runs.
      - name: Run pytest
        run: pytest -v --durations=10

      # A regular (non-editable) install must ship every subpackage.
      - name: Check the wheel contents
        shell: bash
        run: |
          python -m pip wheel . --no-deps -w dist
          python -c "import sys, zipfile, glob; names = zipfile.ZipFile(glob.glob('dist/gtfs_ingest-*.whl')[0]).namelist(); missing = [p for p in ('analysis', 'conflation', 'qa') if f'gtfs_ingest/{p}/__init__.py' not in names]; sys.exit(f'missing subpackages: {missing}' if missing else 0)"

  integration:
    name: Integration (PostGIS)
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gtfs_test
        ports:
          - 5432:5432
        # Wait until the server accepts connections before the job starts.
        options: >-
          --health-cmd "pg_isready -U postgres -d gtfs_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      GTFS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gtfs_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + test deps
        run: python -m pip install -e ".[dev]"

      # ensure_schema() runs `CREATE EXTENSION IF NOT EXISTS postgis` itself as
      # the superuser, so no manual extension bootstrap is needed here.
      - name: Run full test suite (incl. live DB tests)
        run: pytest -v --durations=10

  docs:
    name: Docs (Sphinx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # autodoc imports every module, so the package and its runtime
      # dependencies must be installed - not just the docs toolchain.
      - name: Install package + docs deps
        run: python -m pip install -e ".[docs]"

      # -W turns warnings into errors: malformed docstring markup, a broken
      # cross-reference or a toctree gap fails here instead of silently
      # degrading the published reference. Intersphinx is off so the job never
      # depends on third-party docs sites being up.
      - name: Build HTML
        env:
          DOCS_NO_INTERSPHINX: "1"
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html

      - name: Upload built docs
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 14
