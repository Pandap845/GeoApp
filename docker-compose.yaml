# Local PostgreSQL + PostGIS for the GTFS ingestion pipeline.
#
#   docker compose up -d --wait     # start (healthcheck-gated)
#   docker compose down             # stop (data persists in the named volume)
#
# The matching connection string for .env / --db-url:
#   DATABASE_URL=postgresql+psycopg://transit:cambia_esto@localhost:5432/transit
#
# ./init is mounted at /docker-entrypoint-initdb.d: any *.sql / *.sh placed
# there runs ONCE, on first initialization of an empty data volume only
# (to re-run them: docker compose down -v). The postgis/postgis image already
# enables the postgis extension on POSTGRES_DB, and the pipeline also issues
# CREATE EXTENSION IF NOT EXISTS postgis, so no init script is required.
services:
  transit-db:
    image: postgis/postgis:16-3.4
    container_name: transit-db
    environment:
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: cambia_esto
      POSTGRES_DB: transit
    ports:
      - "5432:5432"
    volumes:
      - transit_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit -d transit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  transit_pgdata:
